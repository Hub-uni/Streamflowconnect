<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamflow</title>

  <style>
    :root {
      --bg: #05070d;
      --blue: #3b5bfd;
      --text: #f5f7fb;
      --muted: #aab2c5;
      --border: rgba(255, 255, 255, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(
          ellipse 760px 520px at 50% 14%,
          rgba(16, 31, 66, 0.78) 0%,
          rgba(13, 27, 58, 0.36) 43%,
          transparent 76%
        ),
        var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, sans-serif;
    }

    /* HEADER */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 100px;
      padding: 22px clamp(20px, 5.2vw, 72px);
      background: #050505;
      border-bottom: 1px solid rgba(255, 255, 255, 0.025);
    }

    /* LOGO AND BRAND */
    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text);
      text-decoration: none;
      font-size: clamp(22px, 2.3vw, 34px);
      font-weight: 650;
      letter-spacing: -0.035em;
      white-space: nowrap;
    }

    .logo svg {
      display: block;
      flex-shrink: 0;
    }

    /* RIGHT SIDE */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 11px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    /* HAMBURGER MENU */
    .menu-wrap {
      position: relative;
    }

    .menu-icon {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 7px;
      width: 48px;
      height: 48px;
      padding: 8px;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .menu-icon span {
      display: block;
      width: 30px;
      height: 3px;
      background: #f5f7fb;
    }

    /* DROPDOWN */
    .nav-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 14px);
      right: 0;
      min-width: 420px;
      gap: 30px;
      padding: 24px;
      background: #0a0a10;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .nav-dropdown.open {
      display: flex;
    }

    .nav-dropdown-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 95px;
    }

    .nav-dropdown-col h4 {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .nav-dropdown-col a {
      color: var(--text);
      font-size: 14px;
      text-decoration: none;
    }

    .nav-dropdown-col a:hover {
      color: #9db8ff;
    }

    /* TOKEN TOOL CARDS */
    .background-area {
      min-height: calc(100vh - 100px);
      padding: 68px 24px 80px;
    }

    .tools-inner {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .tools-heading {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 30px;
    }

    .tools-heading .eyebrow {
      color: #9db8ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .tools-heading h1 {
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.15;
      letter-spacing: -.03em;
      margin-bottom: 12px;
    }

    .tools-heading p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .tool-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(6, 9, 17, .88);
      transition: border-color .2s, transform .2s;
    }

    .tool-card:hover,
    .tool-card.active {
      border-color: rgba(118, 151, 255, .55);
      transform: translateY(-2px);
    }

    .tool-card-trigger {
      width: 100%;
      min-height: 150px;
      padding: 23px 21px;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .tool-card-trigger h2 {
      font-size: 15px;
      letter-spacing: .08em;
      margin-bottom: 12px;
    }

    .tool-card-trigger p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .tool-panel {
      padding: 0 18px 20px;
      border-top: 1px solid var(--border);
    }

    .token-search {
      display: flex;
      gap: 8px;
      margin: 16px 0 8px;
    }

    .token-search input {
      min-width: 0;
      flex: 1;
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 9px;
      outline: none;
      background: #080b13;
      color: white;
      font: inherit;
      font-size: 13px;
    }

    .token-search input:focus {
      border-color: #7189ff;
    }

    .token-search button,
    .tool-action {
      padding: 11px 15px;
      border: 0;
      border-radius: 9px;
      background: var(--blue);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .tool-hint,
    .tool-status {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .token-result {
      margin-top: 14px;
    }

    .token-identity {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .token-identity img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      background: #141a2b;
    }

    .token-identity strong {
      font-size: 14px;
    }

    .token-identity small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .token-chart {
      display: block;
      width: 100%;
      height: 190px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #090c14;
    }

    .token-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }

    .token-metric {
      min-width: 0;
      padding: 9px;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 9px;
      background: rgba(255,255,255,.035);
    }

    .token-metric span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 5px;
    }

    .token-metric strong {
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .fee-note {
      margin: 12px 0;
      padding: 10px;
      border-radius: 9px;
      background: rgba(255,255,255,.035);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .fee-note strong {
      color: var(--text);
    }

    .pair-select {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0a0d17;
      color: var(--text);
      font: inherit;
      font-size: 12px;
    }

    .tool-action {
      display: block;
      width: 100%;
      margin-top: 14px;
      text-align: center;
      text-decoration: none;
    }

    @media (max-width: 850px) {
      .background-area {
        padding: 48px 18px 64px;
      }

      .tool-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .tool-card-trigger {
        min-height: 0;
        padding: 20px;
      }

      .tool-panel {
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    @media (min-width: 851px) and (max-width: 1050px) {
      .tool-grid {
        gap: 12px;
      }

      .tool-card-trigger {
        padding: 19px 16px;
      }
    }

    /* MOBILE RESPONSIVENESS */
    @media (max-width: 720px) {
      header {
        min-height: 82px;
        padding: 18px 20px;
      }

      .logo {
        gap: 12px;
        font-size: 25px;
      }

      .logo svg {
        width: 30px;
        height: 30px;
      }

      .nav-right .btn {
        display: none;
      }

      .menu-icon {
        width: 44px;
        height: 44px;
      }

      .nav-dropdown {
        min-width: 250px;
        flex-direction: column;
        gap: 20px;
      }

      .background-area {
        min-height: calc(100vh - 82px);
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="#" class="logo" aria-label="Streamflow home">
      <svg
        width="34"
        height="34"
        viewBox="0 0 200 200"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <polygon points="99,120 65,120 58,122 50,127 45,133 42,139 40,148 41,149 72,149 83,146 90,141 95,135 98,128" fill="#3b5bfd" />
        <polygon points="40,85 43,98 47,104 60,113 159,114 152,95 145,89 134,85" fill="#3b5bfd" />
        <polygon points="40,79 134,79 145,75 152,69 157,61 159,51 62,51 53,55 45,63" fill="#3b5bfd" />
      </svg>

      <span>Streamflow</span>
    </a>

    <div class="nav-right">
      <button class="btn" type="button">Stake $STREAM</button>
      <button class="btn" type="button">Sign In</button>

      <div class="menu-wrap">
        <button
          class="menu-icon"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="navDropdown"
          onclick="toggleNavMenu(this)"
        >
          <span></span>
          <span></span>
        </button>

        <div class="nav-dropdown" id="navDropdown">
          <div class="nav-dropdown-col">
            <h4>Solutions</h4>
            <a href="#">Vesting</a>
            <a href="#">Airdrops</a>
            <a href="#">Staking</a>
            <a href="#">Token locks</a>
          </div>

          <div class="nav-dropdown-col">
            <h4>Company</h4>
            <a href="#">About</a>
            <a href="#">Careers</a>
            <a href="#">Contact</a>
          </div>

          <div class="nav-dropdown-col">
            <h4>Resources</h4>
            <a href="#">Docs</a>
            <a href="#">Blogs</a>
            <a href="#">FAQs</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="background-area">
    <div class="tools-inner">
      <div class="tools-heading">
        <div class="eyebrow">Streamflow Platform</div>
        <h1>Choose and continue with the available options</h1>
        <p>Search a token address to review and continue to the matching tool.</p>
      </div>

      <div class="tool-grid" id="toolGrid">
        <article class="tool-card" data-tool="airdrop">
          <button class="tool-card-trigger" type="button" aria-expanded="false">
            <h2>AIRDROP &amp; CLAIMING</h2>
            <p>Review and distribute token airdrops.</p>
          </button>
        </article>

        <article class="tool-card" data-tool="lock">
          <button class="tool-card-trigger" type="button" aria-expanded="false">
            <h2>LOCK TOKEN SUPPLY</h2>
            <p>Review and lock supply for future use.</p>
          </button>
        </article>

        <article class="tool-card" data-tool="fees">
          <button class="tool-card-trigger" type="button" aria-expanded="false">
            <h2>REDIRECT FEES</h2>
            <p>Review and redirect pooled fees to new addresses.</p>
          </button>
        </article>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const destinations = {
        airdrop: { label: 'Airdrop & Claiming', href: 'app.html' },
        lock: { label: 'Lock Token Supply', href: 'app.html' },
        fees: { label: 'Redirect Fees', href: 'app.html' }
      };

      const grid = document.getElementById('toolGrid');
      let activeCard = null;

      const money = n =>
        n == null || !Number.isFinite(Number(n))
          ? 'Unavailable'
          : new Intl.NumberFormat('en-US', {
              style: 'currency',
              currency: 'USD',
              notation: Number(n) >= 1e6 ? 'compact' : 'standard',
              maximumFractionDigits: 2
            }).format(Number(n));

      const compact = n =>
        n == null || !Number.isFinite(Number(n))
          ? 'Unavailable'
          : new Intl.NumberFormat('en-US', {
              notation: 'compact',
              maximumFractionDigits: 2
            }).format(Number(n));

      const esc = value =>
        String(value).replace(/[&<>"']/g, char => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char]));

      function collapse() {
        if (!activeCard) return;

        activeCard.querySelector('.tool-panel')?.remove();
        activeCard
          .querySelector('.tool-card-trigger')
          .setAttribute('aria-expanded', 'false');
        activeCard.classList.remove('active');
        activeCard = null;
      }

      function makePanel(key) {
        const config = destinations[key];
        const panel = document.createElement('div');
        panel.className = 'tool-panel';

        panel.innerHTML =
          '<form class="token-search">' +
            '<input aria-label="Token address" placeholder="Paste token address" autocomplete="off" required>' +
            '<button type="submit">Search</button>' +
          '</form>' +
          '<p class="tool-hint">Address search checks matching DEX pairs across chains .</p>' +
          '<div class="tool-status" aria-live="polite"></div>' +
          '<div class="token-result"></div>' +
          '<a class="tool-action" href="' + config.href + '">Continue to ' + config.label + '</a>';

        const form = panel.querySelector('form');

        form.addEventListener('submit', async event => {
          event.preventDefault();

          const address = form.querySelector('input').value.trim();
          const status = panel.querySelector('.tool-status');
          const result = panel.querySelector('.token-result');

          result.replaceChildren();
          status.textContent = 'checking…';

          try {
            const response = await fetch(
              'https://api.dexscreener.com/latest/dex/search?q=' +
              encodeURIComponent(address)
            );

            if (!response.ok) {
              throw new Error('DexScreener returned HTTP ' + response.status);
            }

            const data = await response.json();
            const matches = (data.pairs || []).filter(pair =>
              [pair.baseToken?.address, pair.quoteToken?.address].some(
                tokenAddress =>
                  String(tokenAddress || '').toLowerCase() === address.toLowerCase()
              )
            );

            if (!matches.length) {
              status.textContent =
                'No indexed trading pairs matched that token address. Check the address and try again.';
              return;
            }

            matches.sort(
              (a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0)
            );

            status.textContent = '';

            function render(pair) {
              const isBase =
                String(pair.baseToken?.address || '').toLowerCase() ===
                address.toLowerCase();

              const token = isBase ? pair.baseToken : pair.quoteToken;
              const cap = pair.marketCap ?? pair.fdv ?? null;
              const poolSymbol = isBase
                ? pair.quoteToken?.symbol
                : pair.baseToken?.symbol;
              const poolAmount = isBase
                ? pair.liquidity?.quote
                : pair.liquidity?.base;

              const poolLabel =
                poolSymbol && /^(w?sol)$/i.test(poolSymbol)
                  ? 'Pooled SOL'
                  : 'Pooled ' + (poolSymbol || 'token');

              const chart =
                'https://dexscreener.com/' +
                encodeURIComponent(pair.chainId) +
                '/' +
                encodeURIComponent(pair.pairAddress) +
                '?embed=1&theme=dark&trades=0&info=0';

              result.innerHTML =
                '<div class="token-identity">' +
                  (pair.info?.imageUrl
                    ? '<img src="' + esc(pair.info.imageUrl) + '" alt="" loading="lazy">'
                    : '') +
                  '<div><strong>' +
                    esc(token.name || 'Unknown token') +
                    ' (' +
                    esc(token.symbol || '—') +
                    ')</strong><small>' +
                    esc(pair.chainId || 'Unknown chain') +
                    ' · ' +
                    esc(pair.dexId || 'DEX') +
                    ' · ' +
                    esc(address.slice(0, 7) + '…' + address.slice(-5)) +
                  '</small></div>' +
                '</div>' +
                '<iframe class="token-chart" title="' +
                  esc(token.symbol || 'Token') +
                  ' price chart" src="' +
                  chart +
                  '" loading="lazy" referrerpolicy="no-referrer"></iframe>' +
                '<div class="token-metrics">' +
                  '<div class="token-metric"><span>Market cap' +
                    (pair.marketCap == null && pair.fdv != null
                      ? ' (FDV proxy)'
                      : '') +
                    '</span><strong>' +
                    money(cap) +
                  '</strong></div>' +
                  '<div class="token-metric"><span>24h volume</span><strong>' +
                    money(pair.volume?.h24) +
                  '</strong></div>' +
                  '<div class="token-metric"><span>Liquidity</span><strong>' +
                    money(pair.liquidity?.usd) +
                  '</strong></div>' +
                  '<div class="token-metric"><span>' +
                    esc(poolLabel) +
                    '</span><strong>' +
                    compact(poolAmount) +
                    ' ' +
                    esc(poolSymbol || '') +
                  '</strong></div>' +
                '</div>' +
                '<div class="fee-note"><strong> Tradingfees: </strong></div>';
            }

            render(matches[0]);

            if (matches.length > 1) {
              const select = document.createElement('select');
              select.className = 'pair-select';
              select.setAttribute(
                'aria-label',
                'Choose a chain and liquidity pool'
              );

              matches.slice(0, 20).forEach((pair, index) => {
                const option = document.createElement('option');
                option.value = String(index);
                option.textContent =
                  pair.chainId +
                  ' · ' +
                  pair.dexId +
                  ' · liquidity ' +
                  money(pair.liquidity?.usd);
                select.append(option);
              });

              select.addEventListener('change', () => {
                render(matches[Number(select.value)]);
              });

              result.append(select);
            }
          } catch (error) {
            status.textContent =
              'Could not load token data. Check your connection and try again. ' +
              error.message;
          }
        });

        panel.querySelector('.tool-action').addEventListener('click', event => {
          event.preventDefault();
          const href = event.currentTarget.href;
          collapse();
          window.location.href = href;
        });

        return panel;
      }

      grid.addEventListener('click', event => {
        const trigger = event.target.closest('.tool-card-trigger');
        if (!trigger) return;

        const card = trigger.closest('.tool-card');

        if (activeCard === card) {
          collapse();
          return;
        }

        collapse();
        activeCard = card;
        card.classList.add('active');
        trigger.setAttribute('aria-expanded', 'true');
        card.append(makePanel(card.dataset.tool));
      });
    })();

    function toggleNavMenu(button) {
      const menu = document.getElementById("navDropdown");
      const isOpen = menu.classList.toggle("open");
      button.setAttribute("aria-expanded", String(isOpen));
    }

    document.addEventListener("click", function (event) {
      const wrap = document.querySelector(".menu-wrap");

      if (wrap && !wrap.contains(event.target)) {
        const menu = document.getElementById("navDropdown");
        const button = wrap.querySelector(".menu-icon");

        menu.classList.remove("open");
        button.setAttribute("aria-expanded", "false");
      }
    });
  </script>
</body>
</html>
